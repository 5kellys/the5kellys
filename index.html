<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kellys</title>
<meta name="description" content="The Kelly family.">

<style>
  :root { --bg: #fbfaf7; --fg: #1d1d1f; --muted: #5b5b60; --accent: #1d1d1f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141415; --fg: #f2f2f0; --muted: #a9a9ad; --accent: #f2f2f0; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 18vh 16px 4rem; }
  h1 { font-size: clamp(2.25rem, 7vw, 3.5rem); line-height: 1.1; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0 0 1rem; }
  ul { list-style: none; padding: 0; margin: 2rem 0 0; }
  li { margin: 0 0 .75rem; }
  a { color: var(--accent); font-size: 1.125rem; }
</style>
</head>
<body>
<main>
  <h1>The Kellys</h1>
  <p>A new family site is on its way.</p>
  <ul>
    <li><a href="https://carson.the5kellys.com">Carson Kelly</a></li>
    <li><a href="https://ava.the5kellys.com">Ava Kelly</a></li>
  </ul>
</main>
</body>
</html>
